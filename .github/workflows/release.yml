name: Build Release

on:
  push:
    tags:
      - v**

jobs:
  build-extension:
    uses: ./.github/workflows/ci-ext.yml

  release:
    permissions: write-all
    runs-on: ubuntu-latest
    needs: [build-extension]

    steps:
    - run: sudo apt-get install -y tree

    - name: Download SM 1.12-dev Linux release
      uses: actions/download-artifact@v4
      with:
        name: sendvaredit_Linux_sm-1.12-dev
        path: sendvaredit_linux_sm-1.12-dev

    - name: Download SM master Linux release
      uses: actions/download-artifact@v4
      with:
        name: sendvaredit_Linux_sm-master
        path: sendvaredit_linux_sm-master

    - name: Download SM 1.12-dev Windows release
      uses: actions/download-artifact@v4
      with:
        name: sendvaredit_Windows_sm-1.12-dev
        path: sendvaredit_windows_sm-1.12-dev

    - name: Download SM master Windows release
      uses: actions/download-artifact@v4
      with:
        name: sendvaredit_Windows_sm-master
        path: sendvaredit_windows_sm-master

    - name: Prepare archives
      run: |
        cd sendvaredit_linux_sm-1.12-dev
        tar -czf sendvaredit_linux_sm-1.12-dev.tar.gz *
        cd ../sendvaredit_linux_sm-master
        tar -czf sendvaredit_linux_sm-master.tar.gz *
        cd ../sendvaredit_windows_sm-1.12-dev
        zip -r sendvaredit_windows_sm-1.12-dev.zip .
        cd ../sendvaredit_windows_sm-master
        zip -r sendvaredit_windows_sm-master.zip .

    - name: Create Release
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
          tag_name: ${{ github.ref_name }}
          release_name: ${{ github.ref_name }}
          body: |
            ${{ github.event.head_commit.message }}
          draft: false
          prerelease: false

    - name: Upload SM 1.12-dev Linux release
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ./sendvaredit_linux/sendvaredit_linux_sm-1.12-dev.tar.gz
        asset_name: sendvaredit_${{ github.ref_name }}_linux_sm-1.12-dev.tar.gz
        asset_content_type: application/gzip

    - name: Upload SM master Linux release
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ./sendvaredit_linux/sendvaredit_linux_sm-master.tar.gz
        asset_name: sendvaredit_${{ github.ref_name }}_linux_sm-master.tar.gz
        asset_content_type: application/gzip

    - name: Upload SM 1.12-dev Windows release
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ./sendvaredit_windows/sendvaredit_windows_sm-1.12-dev.zip
        asset_name: sendvaredit_${{ github.ref_name }}_windows_sm-1.12-dev.zip
        asset_content_type: application/zip

    - name: Upload SM master Windows release
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ./sendvaredit_windows/sendvaredit_windows_sm-master.zip
        asset_name: sendvaredit_${{ github.ref_name }}_windows_sm-master.zip
        asset_content_type: application/zip